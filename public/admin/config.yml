# Sveltia CMS — GitHub backend (no Netlify Identity / Git Gateway)
# Docs: https://sveltiacms.app/en/docs/backends/github
backend:
  name: github
  repo: your-org/your-repo # TODO: replace with your GitHub repo
  branch: main
  # Optional: Netlify OAuth client still works without Identity when hosted on Netlify.
  # For owner-only editing, sign in with a GitHub personal access token in the CMS UI.

logo:
  src: "https://www.senoweb.cz/assets/images/senoweb_og_logo_rounded.png"
  show_in_header: false

locale: "cs"

media_folder: "src/assets/cms"
public_folder: "/assets/cms"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - label: "Blog"
    name: "blog"
    folder: "src/content/blog/cs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}_{{slug}}"
    summary: "{{ title }} [{{ date | date('DD. MM. YYYY') }}]"
    editor:
      preview: true
    fields:
      - { label: "Název", name: "title", widget: "string" }
      - {
          label: "URL odkaz",
          name: "url",
          widget: "string",
          hint: "Slug bez lomítek. Příspěvek bude na /aktuality/{slug}/.",
          pattern:
            [
              "^[a-zà-ž0-9]+(?:-[a-zà-ž0-9]+)*$",
              "Pouze písmena, číslice a pomlčky.",
            ],
        }
      - {
          label: "Popis",
          name: "description",
          widget: "string",
          hint: "Kratší popis pro náhledy a SEO",
        }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Jazyk", name: "locale", widget: "hidden", default: "cs" }
      - label: "Náhledový obrázek"
        name: "image"
        widget: "object"
        summary: "Obrázek - {{fields.alt}}"
        fields:
          - { label: "Obrázek", name: "url", widget: "image" }
          - {
              label: "Popis obrázku",
              name: "alt",
              widget: "string",
              hint: "Popište, co je na obrázku (SEO / a11y).",
            }
      - { label: "Obsah", name: "body", widget: "markdown" }
      - { label: "Štítky", name: "tags", widget: "hidden", default: ["blog"] }
