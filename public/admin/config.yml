# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: user/repo

app_title: "Správa obsahu | Senoweb"

logo:
  src: "https://www.senoweb.cz/assets/images/senoweb_og_logo_rounded.png"
  show_in_header: false

media_folder: "public/assets/cms"
public_folder: "/assets/cms"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

i18n:
  structure: "multiple_folders"
  locales: ["cs"]
  default_locale: "cs"

output:
  omit_empty_optional_fields: true

collections:
  - label: "Aktuality"
    name: "blog"
    icon: article
    folder: "src/content/blog"

    # Entry-relative media so Astro `image()` can optimize (see Sveltia Astro guide: https://sveltiacms.app/en/docs/frameworks/astro#configuration)
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""

    create: true
    delete: true
    i18n: true
    slug: "{{url}}"
    summary: "**{{title}}** — {{date}}"
    thumbnail: "image.url"
    editor:
      preview: true

    fields:
      - { label: "Název", name: "title", widget: "string", hint: "např. Novinky ze servisu", i18n: true }
      - {
          label: "URL",
          name: "url",
          widget: "compute",
          value: "{{fields.title | slugify}}-{{uuid_shorter}}",
          hint: "Generuje se automaticky z názvu + unikátního ID",
          i18n: duplicate,
        }
      - { label: "Popis", name: "description", widget: "string", hint: "Kratší popis pro náhledy a SEO", i18n: true }
      - { label: "Autor", name: "author", widget: "string", hint: "např. Senoweb", i18n: duplicate }
      - { label: "Datum", name: "date", widget: "datetime", i18n: duplicate }

      - label: "Náhledový obrázek"
        name: "image"
        widget: "object"
        i18n: duplicate
        summary: "{{fields.alt}}"
        hint: "Ukládá se vedle příspěvku (entry-relative) kvůli optimalizaci Astro."
        fields:
          - { label: "Obrázek", name: "url", widget: "image" }
          - { label: "Popis obrázku", name: "alt", widget: "string", hint: "Popište, co je na obrázku (SEO / a11y)." }

      - { label: "Obsah příspěvku", name: "body", widget: "markdown", i18n: true }

  - label: "Stránky"
    name: "pages"
    icon: description
    i18n: true
    files:
      - label: "GDPR"
        name: "gdpr"
        file: "src/content/pages/{{locale}}/gdpr.md"
        i18n: true
        fields:
          - { label: "Titulek", name: "title", widget: "string", i18n: true }
          - { label: "Popis", name: "description", widget: "string", i18n: true }
          - { label: "Nadpis", name: "heading", widget: "string", i18n: true }
          - { label: "Obsah", name: "body", widget: "markdown", i18n: true }
